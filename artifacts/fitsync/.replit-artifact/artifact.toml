kind = "web"
previewPath = "/"
title = "FitSync"
description = "A multi-tenant gym and personal trainer management platform with role-based dashboards, subscription plans, attendance tracking, workout progress, and AI-powered diet plans."
version = "1.0.0"
id = "artifacts/fitsync"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24679

[services.development]
run = "pnpm --filter @workspace/fitsync run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fitsync", "run", "build" ]
serve = "static"
publicDir = "artifacts/fitsync/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24679"
BASE_PATH = "/"
